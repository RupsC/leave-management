<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4c48" />
    <title>Leave Management</title>
    <link rel="stylesheet" href="/assets.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>

    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32" focusable="false" aria-hidden="true">
              <rect x="3" y="5" width="26" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="2.4" />
              <path d="M9 3v5M23 3v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
              <path d="M5 12h22" stroke="currentColor" stroke-width="2.2" />
              <path d="M11.5 20.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-text">Leave<em>Ledger</em></span>
        </a>

        <nav class="mainnav" id="mainnav" aria-label="Main"></nav>

        <div class="sidebar-foot">
          <a class="bell" href="#/notifications" id="bell" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M6 9a6 6 0 1 1 12 0c0 5 1.6 6.2 2 6.8H4c.4-.6 2-1.8 2-6.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span class="bell-text">Notifications</span>
            <span class="badge" id="unreadBadge" hidden>0</span>
          </a>
          <span class="who" id="who"></span>
          <button class="btn btn-ghost btn-sm" id="signOutBtn" type="button" hidden>Sign out</button>
        </div>
      </aside>

      <div class="main-col">
        <main id="view" class="view" aria-live="polite">
          <p class="muted">Loading&hellip;</p>
        </main>

        <footer class="site-foot">
          <span class="foot-mark" aria-hidden="true">LL</span>
          <span><strong>LeaveLedger</strong> — fair time off, clearly recorded.</span>
          <span class="foot-fine">Working days only · weekends excluded · half day counts as 0.5</span>
        </footer>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
